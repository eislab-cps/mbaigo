services:
  # ESR - Service Registry (Core System)
  esr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbaigo-esr
    command: ["mbaigo", "core", "start", "esr"]
    ports:
      - "20102:20102"
    networks:
      - mbaigo-network
    volumes:
      - esr-data:/app/systems/esr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20102/serviceregistrar/registry/status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Orchestrator (Core System)
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbaigo-orchestrator
    command: ["mbaigo", "core", "start", "orchestrator"]
    ports:
      - "20103:20103"
    networks:
      - mbaigo-network
    volumes:
      - orchestrator-data:/app/systems/orchestrator
    depends_on:
      esr:
        condition: service_healthy
    restart: unless-stopped

networks:
  mbaigo-network:
    driver: bridge

volumes:
  esr-data:
  orchestrator-data:
